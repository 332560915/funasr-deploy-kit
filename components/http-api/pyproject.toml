[project]
name = "http-api"
version = "0.1.0"
description = "HTTP API for FunASR file transcription"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "fastapi>=0.136.3",
    "funasr-python>=0.1.5",
    "loguru>=0.7.3",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.49.0",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
